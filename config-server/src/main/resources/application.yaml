spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/trung1609/DemoTestMicroserviceConfig.git

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8888
